{% load widget_tweaks %}

<div class="p-4">
  {% for field in form %}
    <div class="mb-3">
      <p class="form-label">{{ field.label_tag }}</p>
      {% render_field field class="form-control" %}
      {% for error in field.errors %}
        <div class="alert alert-danger mt-1 p-2">
          {{ error|escape }}
        </div>
      {% endfor %}
    </div>
  {% endfor %}
</div>

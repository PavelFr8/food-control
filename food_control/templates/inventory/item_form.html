{% extends "base.html" %}

{% block title %}Редактирование склада{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h2 class="mb-4">Позиция склада</h2>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-success">Сохранить</button>
          <a href="{% url 'inventory:item_list' %}" class="btn btn-outline-secondary">Назад</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

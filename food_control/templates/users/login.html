{% extends "base.html" %}
{% load static %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center form-card">
  <div class="col-md-6 col-lg-5">
    <h2 class="text-center mb-4 text-primary-emphasis form-head">Вход</h2>
    <form method="post" class="bg-white p-4 shadow rounded-4">
      {% csrf_token %}
      {% include "includes/form.html" %}
      <div class="d-grid gap-2 mt-4">
        <button class="btn btn-success btn-lg agree-btn" type="submit">Подтвердить</button>
      </div>
      <div class="text-center mt-3">
        <a href="{% url 'users:signup' %}" class="link-success fw-semibold">Зарегистрироваться</a>
        <span class="mx-2"></span>
        <a href="{% url 'users:password_reset' %}" class="link-success fw-semibold">Забыли пароль?</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
